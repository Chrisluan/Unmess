<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Unmess</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700&display=swap"
    />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" href="/favicon.ico" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <!-- O manifest é injetado pelo vite-plugin-pwa; declarar aqui também
         criaria duas fontes divergentes. -->
    <meta name="theme-color" content="#2576d2" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Unmess" />
    <meta
      name="viewport"
      content="minimum-scale=1, initial-scale=1, width=device-width"
    />
    <noscript id="env-insertion-point"></noscript>
    <!-- Endereço público, resolvido em tempo de execução.

         As variáveis VITE_* são gravadas dentro do bundle no build. Isso serve
         para um domínio definitivo, mas não para o túnel provisório, cujo
         endereço muda a cada vez que o cloudflared sobe: cada troca exigiria
         recompilar o frontend inteiro.

         Este arquivo é gerado pelo scripts/tunel-publico.js e servido sem
         cache; quando não existe endereço público, vem vazio e o frontend
         volta a deduzir a API sozinho, como no acesso pela rede local. É um
         script clássico de propósito -- roda antes do módulo do app abaixo. -->
    <script src="/env.js"></script>
    <!-- Faixa de avisos do sistema (UPU).

         Fica fora do bundle de propósito: o aviso mais importante que ela dá é
         "o sistema vai cair em cinco minutos", e esse é justamente o momento em
         que o bundle está sendo trocado. Um componente React desapareceria
         junto com ele.

         O arquivo é publicado na pasta do build pelo próprio UPU, junto com o
         avisos.json que ele lê. Quando o UPU não está instalado, o script
         simplesmente não existe e o `defer` faz o navegador seguir em frente
         sem erro visível. -->
    <script src="/avisos-unmess.js" defer></script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/index.js"></script>
  </body>
</html>
