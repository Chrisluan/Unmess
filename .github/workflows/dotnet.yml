name: dotnet

on:
  pull_request:
    paths:
      - "backend-dotnet/**"
      - "deployer/**"
      - "global.json"
      - ".github/workflows/dotnet.yml"
  push:
    branches:
      - "release*"
      - "production"
      - "dev"
    paths:
      - "backend-dotnet/**"
      - "deployer/**"
      - "global.json"
      - ".github/workflows/dotnet.yml"

permissions:
  contents: read

concurrency:
  group: dotnet-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        solution:
          - backend-dotnet/Unmess.slnx
          - deployer/Unmess.Deployer.slnx
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - run: dotnet restore ${{ matrix.solution }}

      - run: dotnet build ${{ matrix.solution }} --no-restore -c Release

      - run: dotnet test ${{ matrix.solution }} --no-build -c Release

  backend-image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - run: docker build --tag unmess-backend-dotnet:ci backend-dotnet
