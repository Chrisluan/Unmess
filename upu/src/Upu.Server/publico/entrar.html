<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>UPU — entrar</title>
    <link rel="stylesheet" href="/estilo.css" />
  </head>
  <body>
    <form class="portaria" id="formulario">
      <div>
        <h1>UPU</h1>
        <div class="discreta">Unmess Production Updater</div>
      </div>

      <div class="recado" id="recado"></div>

      <div class="campo">
        <label for="senha" id="rotulo-senha">Senha</label>
        <input type="password" id="senha" autocomplete="current-password" autofocus />
        <div class="ajuda" id="ajuda-senha"></div>
      </div>

      <button class="principal" type="submit" id="enviar">Entrar</button>
    </form>

    <script src="/entrar.js"></script>
  </body>
</html>
